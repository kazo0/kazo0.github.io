name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  # Rebuild one preview on demand. Without this, a change to how previews are
  # built only reaches an open PR on its next push, so an oversized preview
  # could sit on gh-pages for weeks.
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to rebuild the preview for"
        required: true

permissions:
  contents: write # push the built preview to gh-pages
  pull-requests: write # leave the sticky preview-link comment

# Newest commit on a PR wins; older in-flight preview builds are cancelled.
concurrency:
  group: preview-${{ github.event.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      PR: ${{ github.event.number || inputs.pr }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The ref a pull_request event checks out by default, spelled out so a
          # manual rebuild lands on the PR rather than on master.
          ref: refs/pull/${{ github.event.number || inputs.pr }}/merge

      - name: Configure preview build
        run: |
          # Serve theme assets and internal links under the preview sub-path.
          sed -i "s|^baseurl:.*|baseurl: \"/previews/pr-${PR}\"|" docs/_config.yml
          # Keep preview page views out of the production analytics property.
          sed -i 's|^  provider: "google-gtag"|  provider: false|' docs/_config.yml

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
          token: ${{ github.token }}

      - name: Post-process preview output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # jekyll-build-pages is a Docker action and writes _site as root;
          # reclaim it so this non-root step can edit the files in place.
          sudo chown -R "$(id -u):$(id -g)" _site

          # Non-baseurl-aware paths hand-written in post markdown still need the
          # preview prefix; theme-emitted links already carry it.
          find _site -name '*.html' -exec \
            sed -i "s|=\"/assets/|=\"/previews/pr-${PR}/assets/|g" {} +

          # Bundle only the images this PR adds or edits and leave the rest to
          # the production root, so previews stop duplicating ~270 MB of assets
          # each. See .github/scripts/preview-slim.py for why that matters.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" \
            --jq '.[] | select(.status != "removed") | .filename' \
            | sed -n 's|^docs/assets/images/||p' | sort -u > "${RUNNER_TEMP}/preview-keep.txt"
          python3 .github/scripts/preview-slim.py \
            _site "/previews/pr-${PR}" "${RUNNER_TEMP}/preview-keep.txt"

          # The apex domain belongs to production only.
          rm -f _site/CNAME
          echo "Preview payload: $(du -sh _site | cut -f1)"

      - name: Publish preview to gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODE: deploy
          DEST_DIR: previews/pr-${{ github.event.number || inputs.pr }}
          SOURCE_DIR: _site
        run: bash .github/scripts/gh-pages-deploy.sh

      - name: Comment preview link
        uses: actions/github-script@v7
        with:
          script: |
            const pr = Number(process.env.PR);
            const url = `https://kazo0.dev/previews/pr-${pr}/`;
            const marker = '<!-- pr-preview -->';
            const body = [
              marker,
              '### 🔎 Preview deployed',
              '',
              `**${url}**`,
              '',
              `Built from ${context.sha.substring(0, 7)}. Updates on every push; removed when the PR closes.`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: pr, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });
            }

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove preview from gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODE: remove
          DEST_DIR: previews/pr-${{ github.event.number }}
        run: bash .github/scripts/gh-pages-deploy.sh

      - name: Update comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.issue.number;
            const marker = '<!-- pr-preview -->';
            const body = `${marker}\n### 🧹 Preview removed\n\nThe preview site for this PR has been torn down.`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: pr, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            }
